[project]
name = "maquete-cumbuco"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ezdxf==1.4.4",
    "fonttools>=4.67.0",
    "numpy>=2.5.4",
    "pandas>=2.2",
    "pillow>=12.3.0",
    "python-calamine>=0.8.3",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "playwright>=1.64.0",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
