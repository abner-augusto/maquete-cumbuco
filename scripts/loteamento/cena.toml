# Papel → layers do PLANTA VENDA.dwg usadas na cena 3D (inventário em dados/inventario-layers.md).
tolerancia = 0.05   # m, simplificação dos contornos
lagoa_camadas = ["APP_30"]
lagoa_texto = "LAGOA AZUL"

[camadas]
Vias = ["AR-CNT-VIA-INT", "AR-CNT-VIA-011"]
Calcadas = ["AR-CNT-PAS-INT"]
Verdes = ["AR-CNT-VRD-INT", "AR-CNT-VRD-EXT"]
Institucional = ["AR-CNT-INT"]
Fundo = ["AR-CNT-FND-TER"]
APP = ["APP_30"]

[terreno]   # platô, morro e entorno (scripts/loteamento/terreno.py)
poligonal = ["AR-CNT-POL"]
# plato_cota = 21.5   # sem esta linha: mediana do levantamento sob os lotes, a 0,5 m
talude = 20.0        # m, do platô ao morro
plato_folga = 10.0   # m de platô além do desenho (uma célula), antes do talude
sigma = 25.0         # m, suavização do levantamento: só as formas grandes
alcance = 300.0      # m da poligonal com o levantamento inteiro
transicao = 100.0    # m do levantamento ao Copernicus
raio = 4000.0        # m do entorno, a partir do centro dos lotes
mar_rebaixo = 5.0    # m que o fundo do mar desce abaixo do plano da água (1 m brigava com ele de longe)
passo_perto = 10.0   # m da grade do terreno perto (múltiplo do passo do Copernicus)
praia_inclinacao = 0.05  # m/m da rampa dos dois lados da linha de costa do OSM (scripts/loteamento/costa.py)
fundo_inclinacao = 0.1   # m/m do fundo do mar além da rampa, até o mar_rebaixo

[acesso]   # a avenida em rampa da rotatória à CE (scripts/loteamento/acesso.py)
camada_via = "AR-CNT-VIA-011"     # a faixa de acesso do DWG (o anel comprido da camada)
recuo_inicio = 6.0         # m: o acesso começa antes da faixa, onde o braço da rotatória ainda é reto (o fim dele é um corte inclinado)
secao = [2.0, 7.0, 3.0, 7.0, 2.0] # calçada, pista, canteiro, pista, calçada: a da avenida até a portaria
raio_boca = 15.0           # m, curva do lado de ângulo agudo com a CE; o outro lado leva o raio da mesma tangente
patamar = 20.0             # m quase planos antes da CE, onde o carro converte
patamar_inclinacao = 0.02
curva_vertical = 20.0      # m de cada curva vertical nas quebras do perfil
rampa_max = 0.18           # o desnível (~17 m em ~110 m) dá ~16,5%
passo = 2.0                # m, aresta máxima das peças em rampa
folga_ce = 5.0             # m além da meia largura da CE que ficam no chão natural (sem o talude do platô)
ilha_base = 10.0           # m, a ilha triangular no fim do canteiro
ilha_comprimento = 15.0
ilha_recuo = 3.0           # m entre a base da ilha e a borda da CE

[placa]   # a placa em volume (scripts/loteamento/placa.py); alturas relativas à cota do platô
recuo_lote = 0.15   # m de cada lado: a junta entre lotes vizinhos tem o dobro
fundo = -1.0        # m, base das paredes: meio-fio, margem da lagoa e saia da borda
fresta_max = 2.0    # m², fresta entre peças encostada na via vira pista

[placa.alturas]
Pista = 0.0
ChaoPlato = 0.25   # quadras sem lote (clube, E.T.E., adm.) e ilhas: no nível da calçada, não afundadas
Calcadas = 0.25
Verdes = 0.25
Institucional = 0.25
Fundo = 0.25
APP = 0.25
Juntas = 0.25
lote = 0.40
Lagoa = -0.30
