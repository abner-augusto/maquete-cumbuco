# Entorno (Plano 4). Raios em metros, a partir do centro da caixa dos lotes.
raio_vias = 4000            # vias e áreas do OSM (mapa pintado no relevo)
raio_faixas = 1500          # vias principais em faixa 3D, perto do loteamento
raio_predios = 1500         # prédios extrudados (Overture)
raio_predios_orla = 4000    # na faixa da orla (Icaraí e Cumbuco), prédios até aqui
orla_m = 1200               # largura da faixa da orla, da linha de costa do OSM para dentro
raio_vegetacao = 2000       # instâncias de vegetação
raio_malha_regional = 25000 # malha viária para os minutos de carro (Pecém, Fortaleza)
tile_px = 4096              # lado maior de cada um dos 4 tiles do chão (~1 m/px no recorte de 8 km)
tile_margem_px = 2          # pixels a mais de borda: o filtro da GPU não abre costura entre tiles
masterplan = true           # fases 2–10 pintadas em segundo plano (scripts/entorno/masterplan.py)
masterplan_saturacao = 0.35
masterplan_opacidade = 0.55

# Orla regional (scripts/entorno/orla.py): faixa simplificada da costa, só com o mapa do OSM, para a
# vista de longe. As pontas são pontos de referência de dados/pontos.json.
orla_de = "Porto do Pecém"
orla_ate = "Aterro da Praia de Iracema"
orla_profundidade = 4000.0  # m terra adentro da costa: a gleba do masterplan chega a 2,8 km dela
orla_margem = 2000.0        # m além de cada ponta, ao longo da costa
orla_passo = 60.0           # m da grade do relevo (o dobro do Copernicus)
orla_desbote = 1500.0       # m em que a borda de terra desbota até sumir (alfa dos vértices)
orla_afundar = 0.5          # m abaixo do entorno detalhado, onde as duas malhas se sobrepõem
orla_tile_px = 2048         # lado maior de cada um dos 4 tiles do mapa da orla
